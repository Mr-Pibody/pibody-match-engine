[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pibody-match-engine"
version = "1.0.0"
description = "Moteur hybride et explicable de recommandation et d'optimisation d'appariement"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nugbognon Elfried ZANNOU" }]
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
pibody-match = "pibody_match.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
